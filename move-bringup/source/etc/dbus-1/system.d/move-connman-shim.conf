<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus policy for the move-connman-shim daemon.

  Allows the daemon (running as root) to own the well-known name net.connman
  and to receive method calls on its interfaces. Other users may introspect
  + call read-only methods so MoveOriginal (running as `ableton`) can talk
  to it without elevated privileges.
-->
<busconfig>
  <policy user="root">
    <allow own="net.connman"/>
    <allow send_destination="net.connman"/>
    <allow send_interface="net.connman.Manager"/>
    <allow send_interface="net.connman.Technology"/>
    <allow send_interface="net.connman.Service"/>
    <allow send_interface="net.connman.Agent"/>
  </policy>

  <policy context="default">
    <allow send_destination="net.connman"/>
    <allow send_interface="net.connman.Manager"/>
    <allow send_interface="net.connman.Technology"/>
    <allow send_interface="net.connman.Service"/>
    <allow send_interface="net.connman.Agent"/>
    <allow receive_sender="net.connman"/>
  </policy>
</busconfig>
