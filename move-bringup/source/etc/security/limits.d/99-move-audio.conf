# PAM resource limits for real-time audio.
#
# Applies to login sessions (ssh, getty, su -). The Move services run as
# `ableton' via systemd's start-stop-daemon, and the unit files already
# lift the same limits via LimitRTPRIO=99 / LimitMEMLOCK=infinity /
# LimitNICE=-20, so this file mainly covers interactive debugging
# sessions and manual `MoveLauncher' launches.
#
# Format: <domain> <type> <item> <value>

# Anyone in the audio group: full RT priority range, unlimited locked
# pages, generous nice headroom. Mirrors what Ubuntu Studio / KXStudio
# / AVLinux / Bela ship by default.
@audio     -  rtprio      99
@audio     -  memlock     unlimited
@audio     -  nice        -20

# Newer RT convention (matches Debian's realtime-privileges package).
# We add this so move-bringup is compatible with the standard package's
# expectations even if the user has it co-installed.
@realtime  -  rtprio      99
@realtime  -  memlock     unlimited
@realtime  -  nice        -20

# The runtime user, explicitly (a belt-and-braces in case both group
# memberships are ever stripped during a future migration).
ableton    -  rtprio      99
ableton    -  memlock     unlimited
ableton    -  nice        -20
