# Real-time tuning for the Move audio loop.
#
# Without RT_GROUP_SCHED in the kernel (see move.fragment.config), these
# two knobs control system-wide SCHED_FIFO/RR runtime caps. The defaults
# (period 1s, runtime 0.95s) let any runaway RT thread eat 95% of CPU
# for a full second before the kernel intervenes - acceptable on a
# server, audibly fatal on Move when the watchdog kicks in. -1 = no cap,
# rely on application correctness + PREEMPT_RT preemption instead.
kernel.sched_rt_runtime_us = -1

# Don't let the kernel preempt audio threads to swap pages. The audio
# loop's working set is small and pinned via LimitMEMLOCK=infinity in
# the systemd unit, but lowering swappiness reduces background pressure.
vm.swappiness = 10

# Keep the user-space watchdog from running afoul of long RT periods.
kernel.watchdog_thresh = 30
