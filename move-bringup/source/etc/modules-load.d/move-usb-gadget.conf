# Load USB gadget composite + NCM function drivers at boot so that
# move-usb-gadget.service can create /sys/kernel/config/usb_gadget/...
# on its first start. Without these loaded early, libcomposite hasn't
# registered the usb_gadget configfs subsystem, and the setup script
# fails its first mkdir with:
#   mkdir: cannot create directory ‘/sys/kernel/config/usb_gadget’:
#   Operation not permitted
# even with configfs itself mounted.
#
# u_ether is pulled in as a dependency of usb_f_ncm.
libcomposite
usb_f_ncm
