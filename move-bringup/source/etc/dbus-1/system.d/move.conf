<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
    <policy user="root">
        <allow own="com.ableton.move"/>
        <allow send_destination="com.ableton.move"/>
        <allow send_interface="com.ableton.move"/>
        <allow receive_sender="com.ableton.move"/>
    </policy>
    <policy user="root">
        <allow own="com.ableton.update"/>
        <allow send_destination="com.ableton.update"/>
        <allow send_interface="com.ableton.update"/>
        <allow receive_sender="com.ableton.update"/>
    </policy>
    <policy user="root">
        <allow own="com.ableton.system"/>
        <allow send_destination="com.ableton.system"/>
        <allow send_interface="com.ableton.system"/>
        <allow receive_sender="com.ableton.system"/>
    </policy>
    <policy user="ableton">
        <allow own="com.ableton.move"/>
        <allow send_destination="com.ableton.move"/>
        <allow send_interface="com.ableton.move"/>
        <allow receive_sender="com.ableton.move"/>
    </policy>
    <policy user="ableton">
        <allow own="com.ableton.update"/>
        <allow send_destination="com.ableton.update"/>
        <allow send_interface="com.ableton.update"/>
        <allow receive_sender="com.ableton.update"/>
    </policy>
    <policy user="ableton">
        <allow own="com.ableton.system"/>
        <allow send_destination="com.ableton.system"/>
        <allow send_interface="com.ableton.system"/>
        <allow receive_sender="com.ableton.system"/>
    </policy>
</busconfig>
